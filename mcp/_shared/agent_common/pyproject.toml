[project]
name = "agent-common"
version = "0.1.0"
description = "Shared library for documentum-ai-platform MCP agents: audit log, component state store, secret resolution, shared path conventions."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
